# ============================================================================
# Render Blueprint — ResQ-Go
# ============================================================================
#
# Creates the full stack on Render:
#   - PostgreSQL (persistent)
#   - API   (NestJS container, port 3001)
#   - Web   (Next.js standalone container, port 3000)
#
# Both services are built from the Dockerfiles in this repository, so what is
# deployed is exactly what `docker compose up` runs locally.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
#
# Secrets below are marked `sync: false`. Render prompts for them the first time
# the blueprint runs and stores them; they are never written to this file.
# To redeploy against services you already have, set `existingService`-style ids
# in the Render dashboard rather than committing them here.
# ============================================================================

databases:
  - name: resq-go-db
    databaseName: resqgo
    user: resqgo_user
    plan: starter
    region: oregon
    postgresMajorVersion: '16'
    # Empty allowlist: only services in this blueprint (and Render's internal
    # network) can reach the database.
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # API — NestJS
  # ---------------------------------------------------------------------------
  - type: web
    name: resq-go-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # Container listens on 3001; this is the port Render exposes.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: DATABASE_URL
        fromDatabase:
          name: resq-go-db
          property: connectionString
      # Required, never defaulted: the API refuses to boot with a known or
      # too-short signing secret. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: BCRYPT_ROUNDS
        value: '12'
      # Comma-separated allowlist. Defaults to this deployment's own web origin.
      - key: CORS_ORIGIN
        sync: false

  # ---------------------------------------------------------------------------
  # Web — Next.js
  # ---------------------------------------------------------------------------
  - type: web
    name: resq-go-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      # Read by the browser at build time and by the server at runtime. Must be
      # the public URL of resq-go-api once Render has assigned it.
      - key: NEXT_PUBLIC_API_URL
        sync: false