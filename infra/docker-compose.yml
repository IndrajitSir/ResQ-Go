version: "3.9"

# Local development PostgreSQL. Use this file when you want to run
# PostgreSQL locally for development instead of relying on a remote instance.
#
# Production uses Render-managed PostgreSQL (see .env.prod).
# Real-time pub/sub uses Upstash Redis (no self-hosted Redis required).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-abs}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abs}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
