# ============================================================================
# ResQ-Go — database only
# ============================================================================
#
# Convenience file for the "run the app on my machine, database in Docker"
# workflow. For the full stack (API + web + database, built from the production
# Dockerfiles) use the repository root `docker-compose.yml` instead.
#
#   docker compose -f infra/docker-compose.yml up -d postgres
#   npm run db:push
#   npm run db:seed
#   npm run dev:api     # http://localhost:3001
#   npm run dev:web     # http://localhost:3000
#
# The credentials match the root compose file and the integration test suite.
# Production uses Render-managed PostgreSQL, not this file.
# ============================================================================

name: resq-go-db

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-abs}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-abs} -d ${POSTGRES_DB:-abs}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata: